{% extends "base.html" %}

{% block title %}Suggest a Movie | MoodFlix{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0"><i class="fas fa-film"></i> Suggest a Movie</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Movie Title *</label>
                                <input type="text" class="form-control" name="title" required placeholder="e.g. Inception">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Year</label>
                                <input type="number" class="form-control" name="year" placeholder="2010">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category *</label>
                            <select class="form-select" name="category_id" required>
                                <option value="" disabled selected>Select a mood...</option>
                                {% for category in categories %}
                                    <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3" placeholder="What is this movie about?"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Poster URL (Image Link)</label>
                            <input type="url" class="form-control" name="posterUrl" placeholder="https://example.com/poster.jpg">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">IMDb Rating</label>
                            <input type="number" step="0.1" class="form-control" name="imdbRating" placeholder="e.g. 8.8">
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-warning">Submit Suggestion</button>
                            <a href="{{ url_for('suggestion.list_suggestions') }}" class="btn btn-light">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
