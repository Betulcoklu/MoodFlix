{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h3 class="mb-0">Add New Movie</h3>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('admin.add_movie') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="title" class="form-label">Movie Title</label>
                                <input type="text" class="form-control" id="title" name="title" required placeholder="e.g. Inception">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="year" class="form-label">Year</label>
                                <input type="number" class="form-control" id="year" name="year" required placeholder="2010">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="posterUrl" class="form-label">Poster Image URL</label>
                            <input type="url" class="form-control" id="posterUrl" name="posterUrl" placeholder="https://...">
                            <div class="form-text">Copy the image address from IMDb or Google.</div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Plot Summary</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>

                        <div class="row align-items-center mb-3">
                            <div class="col-md-6">
                                <label for="imdbRating" class="form-label">IMDb Rating</label>
                                <input type="number" step="0.1" class="form-control" id="imdbRating" name="imdbRating" placeholder="8.8">
                            </div>
                            <div class="col-md-6">
                                <div class="form-check mt-4">
                                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="true" checked>
                                    <label class="form-check-label" for="is_active">
                                        Is Active? (Visible on site)
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="categories" class="form-label fw-bold">Mood Categories</label>
                            <select class="form-select" id="categories" name="mood_category_ids" multiple required size="5">
                                {% for category in categories %}
                                    <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Hold Ctrl (Windows) or Cmd (Mac) to select multiple categories.</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('admin.list_movies') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Movie</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
