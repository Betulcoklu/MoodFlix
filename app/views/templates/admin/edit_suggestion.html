{% extends "base.html" %}

{% block title %}Review Suggestion | Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="fas fa-edit"></i> Review Suggestion</h4>
                    <span class="badge bg-light text-dark">User: {{ suggestion.user.username }}</span>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Movie Title</label>
                                <input type="text" class="form-control" name="title" value="{{ suggestion.title }}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Year</label>
                                <input type="number" class="form-control" name="year" value="{{ suggestion.year or '' }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="mood_category_id" required>
                                {% for category in categories %}
                                    <option value="{{ category.id }}" {% if suggestion.mood_category_id == category.id %}selected{% endif %}>
                                        {{ category.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="4">{{ suggestion.description or '' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Poster URL</label>
                            <input type="url" class="form-control" name="posterUrl" value="{{ suggestion.posterUrl or '' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">IMDb Rating</label>
                            <input type="number" step="0.1" class="form-control" name="imdbRating" value="{{ suggestion.imdbRating or '' }}">
                        </div>

                        <div class="d-flex justify-content-between mt-4 border-top pt-3">
                            <a href="{{ url_for('admin.list_pending_suggestions') }}" class="btn btn-outline-secondary">Cancel</a>
                            
                            <div>
                                <button type="submit" name="action" value="save" class="btn btn-primary me-2">
                                    <i class="fas fa-save"></i> Save Changes
                                </button>
                                <button type="submit" name="action" value="approve" class="btn btn-success">
                                    <i class="fas fa-check"></i> Approve & Create Movie
                                </button>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
