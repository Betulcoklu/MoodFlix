{% extends "base.html" %}

{% block title %}All Moods - MoodFlix{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="text-center mb-5">
        <h1 class="fw-bold display-5">Browse by Mood</h1>
        <p class="text-muted lead">How are you feeling today?</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        {% for category in categories %}
        <div class="col">
            <div class="card h-100 shadow-sm text-center border-0 hover-card">
                <div class="card-body d-flex flex-column justify-content-center p-4">
                    <h3 class="card-title fw-bold text-primary">{{ category.name }}</h3>
                    <p class="card-text text-muted">{{ category.description }}</p>
                    
                    <a href="{{ url_for('movie.list_movies_by_category', category_id=category.id) }}" class="btn btn-outline-primary mt-3 stretched-link">
                        Explore Movies
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
